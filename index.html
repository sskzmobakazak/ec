<style>
:root{
  --navy:#1f3a68; --navy2:#2c4f8a; --red:#d62f35; --ink:#1d2433; --muted:#5d6678;
  --line:#dfe4ec; --bg:#f4f6fa; --card:#ffffff; --soft:#eef2f8; --amber:#fff4cc; --amberInk:#7a5a00;
  --ok:#e7f4ec; --okInk:#1d6b3a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--navy2)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 48px}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--red)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
header.top img{width:44px;height:44px;border-radius:50%;background:#fff;flex:none}
header.top .t1{font-weight:700;font-size:17px;letter-spacing:.2px;line-height:1.2}
header.top .t2{font-size:13px;opacity:.85}
.draftbar{background:var(--amber);color:var(--amberInk);border-bottom:1px solid #f0d77a;
  font-weight:700;font-size:14px;text-align:center;padding:8px 12px;letter-spacing:.3px}
.wm{position:fixed;inset:0;pointer-events:none;z-index:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wm span{font:700 22vw/1 "Source Sans 3",sans-serif;color:rgba(214,47,53,.06);transform:rotate(-35deg);white-space:nowrap}
main{position:relative;z-index:2}
#draftbar{position:sticky;top:0;z-index:20}
.okbar{background:#e7f5ec;color:#1d6b3a;border-bottom:1px solid #b9e0c6;text-align:center;font:600 14px "Source Sans 3",sans-serif;padding:8px 12px}
.btn[disabled]{opacity:.6;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.crumbs{margin-top:14px;font-size:14px}
.crumbs a{text-decoration:none}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
h1{font:700 22px/1.25 "Source Serif 4",Georgia,serif;color:var(--navy);margin:8px 0 2px}
.sub{color:var(--muted);font-size:15px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:14px 0 0;font-size:15px}
.facts dt{font-weight:600;color:var(--navy)}
.facts dd{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);
  border-radius:999px;padding:7px 14px;font:600 14px "Source Sans 3",sans-serif;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;font:700 17px/1.3 "Source Sans 3",sans-serif;color:var(--navy);
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(#fff,#fafbfd)}
details.sec>summary::-webkit-details-marker,details.item>summary::-webkit-details-marker{display:none}
details>summary .chev{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);display:grid;place-items:center;
  transition:transform .2s;color:var(--navy);font-size:13px}
details[open]>summary .chev{transform:rotate(180deg)}
.secbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
details.item{border:1px solid var(--line);border-radius:10px;margin-top:10px;background:#fff}
details.item>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between;gap:10px}
details.item .ib{padding:0 12px 10px}
p{margin:10px 0}
ul.bl{margin:8px 0;padding-left:20px}
ul.bl li{margin:6px 0}
li.decision{list-style:none;margin-left:-20px;background:var(--ok);border-left:4px solid #2e8b57;border-radius:8px;padding:8px 10px}
li.decision b:first-child{color:var(--okInk)}
.note{color:var(--muted);font-size:14px;font-style:italic}
.callout{background:var(--soft);border-radius:10px;padding:4px 14px 10px}
.callout h4{margin:12px 0 4px;color:var(--navy);font-size:15px;text-transform:uppercase;letter-spacing:.4px}
.callout ol{margin:4px 0;padding-left:22px}
.callout li{margin:4px 0}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
table.t th{background:var(--navy);color:#fff;text-align:left;font-weight:600;padding:8px}
table.t td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
table.t tr:nth-child(even) td{background:#fafbfd}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--amber);color:var(--amberInk)}
.pill.done{background:var(--ok);color:var(--okInk)}
.sig{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.sig>div{flex:1 1 220px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px}
.sig i{color:var(--muted)}
.list a.m{display:block;text-decoration:none;color:inherit}
.list .m .n{font-weight:700;color:var(--navy);font-size:17px}
.list .m .d{font-size:13px;color:var(--muted);margin-top:2px}
.foot{margin-top:24px;font-size:12.5px;color:var(--muted);text-align:center}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.tools{display:flex;justify-content:flex-end;margin-top:10px}
.linkbtn{background:none;border:0;color:var(--navy2);font:600 14px "Source Sans 3",sans-serif;cursor:pointer;padding:4px}
/* Tables become cards on phones */
@media (max-width:640px){
  body{font-size:15.5px}
  h1{font-size:20px}
  table.t.stack thead{display:none}
  table.t.stack,table.t.stack tbody,table.t.stack tr,table.t.stack td{display:block;width:100%}
  table.t.stack tr{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:6px 10px;background:#fff}
  table.t.stack tr:nth-child(even) td{background:transparent}
  table.t.stack td{border:0;padding:3px 0}
  table.t.stack td[data-l]:before{content:attr(data-l);display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  table.t.stack td.lead{font-weight:700;color:var(--navy)}
  table.t.act tr{display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;align-items:center;padding:8px 12px}
  table.t.act td:before{display:none!important}
  table.t.act td.c-id{grid-column:1;grid-row:1;font-size:13px;color:var(--muted)}
  table.t.act td.c-status{grid-column:3;grid-row:1;justify-self:end}
  table.t.act td.c-action{grid-column:1/-1;font-weight:600;color:var(--ink);padding-top:2px}
  table.t.act td.c-owner,table.t.act td.c-due{grid-column:1/-1;font-size:14px;color:var(--muted);padding:1px 0}
  table.t.act td.c-owner:before{content:"Owner: "!important;display:inline!important;font-weight:600;color:var(--navy)}
  table.t.act td.c-due:before{content:"Due: "!important;display:inline!important;font-weight:600;color:var(--navy)}
  .facts{grid-template-columns:1fr;gap:0}
  .facts dt{margin-top:8px;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
}
@media print{.draftbar,.btns,.tools,header.top{display:none}details.sec,details.item{border:0}.wm span{color:rgba(0,0,0,.06)}}
</style>
</head>

  <div><div class="t1">SSKZM Old Boys' Association</div><div class="t2">EC Papers · EC 2026-27</div></div>
</div></header>
<div id="draftbar"></div>
<div id="wm"></div>
<main class="wrap" id="app"><div class="loading">Loading…</div></main>

<script>
var API = 'https://script.google.com/macros/s/AKfycbxbmWGt3CGeeaqDbevmz7icq4NT2vKK1b0Y5uq1qn31a_mASRXlTFHzwCIiv2kypvm6/exec';
var INITIAL_ID = new URLSearchParams(location.search).get('m') || '';
var app = document.getElementById('app');
function cacheGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function cacheSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function api(qs, key, done, onErr){
  var cached = cacheGet(key); if(cached) done(cached, true);
  fetch(API + qs, {credentials:'omit'}).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok) throw new Error(j.error||'Error');
    if(!cached || JSON.stringify(cached)!==JSON.stringify(j.data)){ cacheSet(key,j.data); done(j.data,false); }
  }).catch(function(e){ if(!cached) onErr(e); });
}

function stripBullet(h){ return h.replace(/^\s*(?:<b>)?\s*[••◦]\s*(?:<\/b>)?\s*/, function(m){ return m.indexOf('<b>')>=0 && m.indexOf('</b>')<0 ? '<b>' : ''; }); }
function text(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent.replace(/\s+/g,' ').trim(); }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function chev(){ return '<span class="chev" aria-hidden="true">▾</span>'; }
function cellHtml(parts){ return parts.map(function(p){return p.html;}).join('<br>').replace(/(<br>\s*){3,}/g,'<br><br>'); }

function setDraft(on, conf){
  document.getElementById('draftbar').innerHTML = on ? '<div class="draftbar">DRAFT · for EC review, not final</div>' :
    (conf ? '<div class="okbar">✓ CONFIRMED'+(conf==='signed'?' · signed copy available':'')+'</div>' : '');
  document.getElementById('wm').innerHTML = on ? '<div class="wm"><span>DRAFT</span></div>' : '';
}

var PDFLIB = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
function loadPdfLib(){
  return window.PDFLib ? Promise.resolve() : new Promise(function(ok,no){
    var s=document.createElement('script'); s.src=PDFLIB; s.onload=ok; s.onerror=function(){no(new Error('Could not load PDF tools'));}; document.head.appendChild(s);
  });
}
function b64bytes(b){ var s=atob(b), a=new Uint8Array(s.length); for(var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function stampDraft(bytes){
  var L;
  return loadPdfLib().then(function(){ L=window.PDFLib; return Promise.all([L.PDFDocument.load(bytes), L.PDFDocument.create()]); }).then(function(r){
    var src=r[0], out=r[1];
    return Promise.all([out.embedPages(src.getPages()), out.embedFont(L.StandardFonts.HelveticaBold)]).then(function(r2){
      var font=r2[1], red=L.rgb(0.84,0.18,0.21), note='DRAFT - for EC review, not final';
      r2[0].forEach(function(ep){
        var w=ep.width, h=ep.height, p=out.addPage([w,h]);
        p.drawPage(ep,{x:0,y:0,width:w,height:h});
        var size=Math.min(w,h)*0.28, tw=font.widthOfTextAtSize('DRAFT',size);
        var ang=Math.atan2(h,w), c=Math.cos(ang), sn=Math.sin(ang), dx=(tw/2)*c-(size*0.35)*sn, dy=(tw/2)*sn+(size*0.35)*c;
        p.drawText('DRAFT',{x:w/2-dx, y:h/2-dy, size:size, font:font, color:red, opacity:0.13, rotate:L.degrees(ang*180/Math.PI)});
        p.drawText(note,{x:(w-font.widthOfTextAtSize(note,9))/2, y:h-18, size:9, font:font, color:red, opacity:0.8});
      });
      out.setTitle(src.getTitle()||'Minutes (DRAFT)');
      return out.save();
    });
  });
}
function saveBlob(bytes, name){
  var url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
}
function downloadPdf(id, btn){
  var label=btn.innerHTML; btn.disabled=true; btn.innerHTML='Preparing PDF…';
  fetch(API+'?api=pdf&m='+encodeURIComponent(id),{credentials:'omit'}).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok) throw new Error(j.error||'Error');
    var d=j.data, bytes=b64bytes(d.b64);
    var base=d.name.replace(/^EC 2026-27\s*/,'').replace(/[\\/:*?"<>|]/g,'');
    if(d.draft) return stampDraft(bytes).then(function(b){ saveBlob(b, base+' (DRAFT).pdf'); });
    saveBlob(bytes, base+(d.signed?' (Signed)':'')+'.pdf');
  }).catch(function(e){ alert('Sorry, the PDF could not be prepared. '+(e&&e.message||'')); })
    .then(function(){ btn.disabled=false; btn.innerHTML=label; });
}

function showList(){
  setDraft(false);
  app.innerHTML = '<div class="loading">Loading…</div>';
  api('', 'ec:list', function(items){
    var h = '<div class="card"><h1>EC Meeting Minutes</h1><div class="sub">Tap a meeting to read the minutes.</div></div><div class="list">';
    if(!items.length) h += '<div class="card">No minutes yet.</div>';
    items.forEach(function(m){
      h += '<div class="card"><a class="m" href="?m='+m.id+'" data-id="'+m.id+'"><div class="n">EC Mtg '+String(m.no).padStart(2,'0')+
        (m.draft?' <span class="pill">Draft</span>':' <span class="pill done">Confirmed</span>')+'</div><div class="d">'+m.name.replace(/</g,'&lt;')+
        '</div><div class="d">Last updated '+m.updated+'</div></a></div>';
    });
    app.innerHTML = h + '</div><div class="foot">SSKZM OBA · EC 2026-27</div>';
    app.querySelectorAll('a.m').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); openMeeting(a.dataset.id,true); }; });
  }, fail);
}

function fail(err){ app.innerHTML = '<div class="card">Sorry, this could not be loaded. '+(err && err.message ? err.message.replace(/</g,'&lt;') : '')+'</div>'; }

function openMeeting(id,push){
  app.innerHTML = '<div class="loading">Loading minutes…</div>';
  window.scrollTo(0,0);
  if(push){ history.pushState({m:id}, '', '?m='+encodeURIComponent(id)); }
  api('?api=meeting&m='+encodeURIComponent(id), 'ec:m:'+id, function(d){ renderMeeting(d); }, fail);
}

function renderMeeting(d){
  setDraft(d.draft, d.draft ? '' : (d.signed ? 'signed' : 'yes'));
  document.title = 'EC Mtg '+(d.title.match(/EC Mtg (\d+)/)||['',''])[1]+' Minutes | SSKZM OBA';
  var B = d.blocks, i = 0, out = el('div');
  out.appendChild(el('div','crumbs','<a href="./" id="back">‹ All meetings</a>'));
  var head = el('div','card'); out.appendChild(head);
  var metaL='', metaR='', title='', sub='', facts=null;

  // Header: ref line, title, subtitle, facts table
  for(; i<B.length; i++){
    var b=B[i];
    if(b.t==='table'){ facts=b; i++; break; }
    var tx=text(b.html);
    if(/^Ref:/i.test(tx)){ var m=tx.split(/\s{2,}|(?=Date:)/); metaL=m[0]; metaR=(tx.match(/Date:\s*.*/)||[''])[0]; }
    else if(!title) title=tx; else sub=tx;
  }
  head.innerHTML = '<div class="meta"><span>'+metaL.replace(/Date:.*/,'')+'</span><span>'+metaR+'</span></div>'+
    '<h1>'+title.replace(/^MINUTES OF THE /i,'Minutes of the ').replace(/EXECUTIVE COMMITTEE MEETING/i,'Executive Committee Meeting')+'</h1><div class="sub">'+sub+'</div>';
  if(facts){
    var dl='<dl class="facts">';
    facts.rows.forEach(function(r){ dl+='<dt>'+text(cellHtml(r[0]))+'</dt><dd>'+cellHtml(r[1]||[])+'</dd>'; });
    head.innerHTML += dl+'</dl>';
  }
  head.innerHTML += '<div class="btns"><button class="btn primary" id="pdfbtn">⬇ PDF'+(d.draft?' (draft)':(d.signed?' (signed)':''))+'</button>'+
    (d.draft ? '<a class="btn" href="'+d.docUrl+'" target="_blank" rel="noopener">✎ Comment / suggest edits</a>' : '')+'</div>';
  head.querySelector('#pdfbtn').onclick = function(){ downloadPdf(d.id, this); };

  var tools = el('div','tools','<button class="linkbtn" id="expand">Expand all</button>'); out.appendChild(tools);

  // Sections
  var sec=null, body=null, item=null, list=null, secNo=0;
  function target(){ return item ? item.querySelector('.ib') : body; }
  function closeList(){ list=null; }
  function newSection(label){
    closeList(); item=null; secNo++;
    sec = el('details','sec'); sec.open = !/attendance/i.test(label);
    sec.innerHTML = '<summary><span>'+label+'</span>'+chev()+'</summary>';
    body = el('div','secbody'); sec.appendChild(body); out.appendChild(sec);
  }
  function newItem(label){
    closeList();
    item = el('details','item'); item.open = window.innerWidth>900;
    item.innerHTML = '<summary><span>'+label+'</span>'+chev()+'</summary><div class="ib"></div>';
    body.appendChild(item);
  }
  var sigs=null;
  for(; i<B.length; i++){
    var b=B[i];
    if(b.t==='p'){
      var tx=text(b.html);
      if(b.bold && /^\d+\.\s/.test(tx)){ newSection(tx); continue; }
      if(!body){ newSection('Minutes'); }
      if(b.bold && tx.length<90){ newItem(tx); continue; }
      if(/^[••◦]/.test(tx) || b.list){
        if(!list){ list=el('ul','bl'); target().appendChild(list); }
        var h=stripBullet(b.html), li=el('li',null,h);
        if(/^Decision\b/i.test(text(h))) li.className='decision';
        list.appendChild(li); continue;
      }
      closeList();
      var p=el('p',null,b.html);
      if(/^Action numbers|^\*/.test(tx)) p.className='note';
      target().appendChild(p);
    } else if(b.t==='table'){
      closeList();
      var R=b.rows, nc=R[0].length;
      var first=text(cellHtml(R[0][0]));
      if(/^Recorded by|^Confirmed by/i.test(first)){ sigs=R[0]; continue; }
      if(!body) newSection('Minutes');
      if(R.length===1 && nc===1){ // summary box
        var box=el('div','callout'), ol=null;
        R[0][0].forEach(function(p){
          var t=text(p.html); if(!t) return;
          if(p.bold && t.length<40){ box.appendChild(el('h4',null,t)); ol=null; return; }
          var m=t.match(/^(\d+)\.\s*(.*)$/);
          if(m){ if(!ol){ ol=el('ol'); box.appendChild(ol);} ol.appendChild(el('li',null,p.html.replace(/^\s*\d+\.\s*/,''))); }
          else { ol=null; box.appendChild(el('p',null,p.html)); }
        });
        target().appendChild(box); continue;
      }
      var hdr=R[0].map(function(c){return text(cellHtml(c));});
      var isAct = hdr.some(function(h){return /^id$/i.test(h);}) && hdr.some(function(h){return /^status$/i.test(h);});
      var tb='<table class="t stack'+(isAct?' act':'')+'"><thead><tr>'+hdr.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr></thead><tbody>';
      for(var r=1;r<R.length;r++){
        tb+='<tr>'+R[r].map(function(c,ci){
          var v=cellHtml(c), tv=text(v);
          if(/^status$/i.test(hdr[ci])) v='<span class="pill'+(/done|closed|complete/i.test(tv)?' done':'')+'">'+tv+'</span>';
          return '<td class="'+(ci===0?'lead ':'')+'c-'+hdr[ci].toLowerCase().replace(/[^a-z]/g,'')+'" data-l="'+hdr[ci]+'">'+v+'</td>';
        }).join('')+'</tr>';
      }
      target().appendChild(el('div',null,tb+'</tbody></table>'));
    }
  }
  if(sigs){
    var s=el('div','sig');
    sigs.forEach(function(c){ s.appendChild(el('div',null,cellHtml(c).replace(/^(\s*<br>)+|(<br>\s*)+$/g,'').replace(/(<br>\s*){2,}/g,'<br><br>'))); });
    out.appendChild(s);
  }
  out.appendChild(el('div','foot','Last updated '+d.updated+' · The Google Doc is the master copy.'));
  app.innerHTML=''; app.appendChild(out);
  document.getElementById('back').onclick=function(e){ e.preventDefault(); history.pushState({}, '', location.pathname); showList(); };
  var ex=document.getElementById('expand');
  ex.onclick=function(){ var all=app.querySelectorAll('details'); var open=ex.textContent==='Expand all';
    all.forEach(function(x){ x.open=open; }); ex.textContent=open?'Collapse all':'Expand all'; };
}

window.addEventListener('popstate', function(){ var m=new URLSearchParams(location.search).get('m'); if(m) openMeeting(m,false); else showList(); });
if(INITIAL_ID) openMeeting(INITIAL_ID,false); else showList();
</script>
</body>
</html>
